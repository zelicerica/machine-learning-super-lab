   <g id="text_1">
    <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b42" x="57.6" y="39.6" transform="rotate(-0 57.6 39.6)">Using a model and teaching a model</text>
   </g>
   <g id="text_2">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506479" x="57.6" y="72.864" transform="rotate(-0 57.6 72.864)">Inference uses learned weights. Training changes selected weights.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2676ba" x="77.184" y="162.36" transform="rotate(-0 77.184 162.36)">INFERENCE  ·  produce an answer</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #12856c" x="641.664" y="162.36" transform="rotate(-0 641.664 162.36)">TRAINING  ·  learn from an example</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="293.76" y="235.385156" transform="rotate(-0 293.76 235.385156)">1  Read the prompt</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="293.76" y="313.001156" transform="rotate(-0 293.76 313.001156)">2  Convert text into token numbers</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="293.76" y="390.617156" transform="rotate(-0 293.76 390.617156)">3  Use fixed weights to predict scores</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="293.76" y="468.233156" transform="rotate(-0 293.76 468.233156)">4  Choose and append a token</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="293.76" y="545.849156" transform="rotate(-0 293.76 545.849156)">5  Stop, or repeat from step 3</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="858.24" y="235.385156" transform="rotate(-0 858.24 235.385156)">1  Read input and correct target</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="858.24" y="313.001156" transform="rotate(-0 858.24 313.001156)">2  Predict using the current weights</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="858.24" y="390.617156" transform="rotate(-0 858.24 390.617156)">3  Measure prediction error with a loss</text>
   </g>
   <g id="text_13">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="858.24" y="468.233156" transform="rotate(-0 858.24 468.233156)">4  Calculate gradients</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="858.24" y="545.849156" transform="rotate(-0 858.24 545.849156)">5  Optimizer updates selected weights</text>
   </g>
   <g id="text_15">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(86.4 604.847219)">What changes?</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(86.4 623.183609)">Prompt, activations, cache and output.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(86.4 641.52)">The learned weights stay fixed.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(650.88 604.847219)">What changes?</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(650.88 623.183609)">Selected learned weights.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(650.88 641.52)">Validate on examples excluded from training.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b42" x="57.6" y="724.68" transform="rotate(-0 57.6 724.68)">Retrieval adds relevant notes to the prompt before inference. It does not itself train the model.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506479" x="57.6" y="752.4" transform="rotate(-0 57.6 752.4)">Low-rank adaptation trains small added matrices while keeping most original weights frozen.</text>
   </g>
  </g>
 </g>
