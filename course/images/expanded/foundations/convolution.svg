<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Track the image tensor through the network</title><desc id="desc">A single-channel 8 by 8 image becomes eight 8 by 8 feature maps, then eight 4 by 4 pooled maps, then sixteen 4 by 4 maps. Flattening gives 256 values, followed by ten class scores.</desc>
