<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Split a mixed group into clearer branches</title><desc id="desc">A root contains six normal and four fault examples. One split creates a left branch with five normal and zero faults, and a right branch with one normal and four faults. Counts sum to the original ten.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8192ae"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="18" fill="#0b1020"/>
<text x="40" y="38" font-size="13" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="2">FOUNDATIONS / TREE</text>
<text x="40" y="84" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">Split a mixed group into clearer branches</text>
<text x="40" y="117" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Follow the exact normal/fault counts from the lesson example.</text>
<line x1="40" y1="645" x2="1080" y2="645" stroke="#344563" stroke-width="1"/>
<text x="40" y="674" font-size="14" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Teaching illustration • Use your own lab run for measured results.</text>
<rect x="380" y="155" width="360" height="135" rx="12" fill="#131c31" stroke="#344563"/>
<text x="560" y="186" font-size="18" fill="#e6edf7" font-weight="700" text-anchor="middle" letter-spacing="0">Starting node: 10 examples</text>
<circle cx="410" cy="220" r="8" fill="#4ade80"/>
<circle cx="436" cy="220" r="8" fill="#4ade80"/>
<circle cx="462" cy="220" r="8" fill="#4ade80"/>
<circle cx="488" cy="220" r="8" fill="#4ade80"/>
<circle cx="514" cy="220" r="8" fill="#4ade80"/>
<circle cx="540" cy="220" r="8" fill="#4ade80"/>
<circle cx="566" cy="220" r="8" fill="#fb8fa1"/>
<circle cx="592" cy="220" r="8" fill="#fb8fa1"/>
<circle cx="618" cy="220" r="8" fill="#fb8fa1"/>
<circle cx="644" cy="220" r="8" fill="#fb8fa1"/>
<text x="402" y="262" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">6 normal  /  4 faults</text>
<path d="M560 290 V330 H285 V365" fill="none" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560 330 H835 V365" fill="none" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315" y="337" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">Split condition holds</text>
<text x="811" y="337" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">Condition does not hold</text>
<rect x="95" y="370" width="380" height="135" rx="12" fill="#131c31" stroke="#344563"/>
<text x="285" y="401" font-size="18" fill="#e6edf7" font-weight="700" text-anchor="middle" letter-spacing="0">Branch A: 5 examples</text>
<circle cx="125" cy="435" r="8" fill="#4ade80"/>
<circle cx="151" cy="435" r="8" fill="#4ade80"/>
<circle cx="177" cy="435" r="8" fill="#4ade80"/>
<circle cx="203" cy="435" r="8" fill="#4ade80"/>
<circle cx="229" cy="435" r="8" fill="#4ade80"/>
<text x="117" y="477" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">5 normal  /  0 faults</text>
<rect x="645" y="370" width="380" height="135" rx="12" fill="#131c31" stroke="#344563"/>
<text x="835" y="401" font-size="18" fill="#e6edf7" font-weight="700" text-anchor="middle" letter-spacing="0">Branch B: 5 examples</text>
<circle cx="675" cy="435" r="8" fill="#4ade80"/>
<circle cx="701" cy="435" r="8" fill="#fb8fa1"/>
<circle cx="727" cy="435" r="8" fill="#fb8fa1"/>
<circle cx="753" cy="435" r="8" fill="#fb8fa1"/>
<circle cx="779" cy="435" r="8" fill="#fb8fa1"/>
<text x="667" y="477" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">1 normal  /  4 faults</text>
<text x="285" y="540" font-size="23" fill="#4ade80" font-weight="700" text-anchor="middle" letter-spacing="0">All normal</text>
<text x="835" y="540" font-size="23" fill="#fb8fa1" font-weight="700" text-anchor="middle" letter-spacing="0">Mostly faults</text>
<rect x="95" y="555" width="930" height="82" rx="12" fill="#131c31"/>
