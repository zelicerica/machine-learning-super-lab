<text x="115" y="584" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Training searches feature thresholds that reduce label impurity.</text>
<text x="115" y="609" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">A clearer training split still needs validation on held-out examples.</text>
</g></svg>