<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">From a score to a probability to a decision</title><desc id="desc">Sigmoid score zero is probability 0.5. Score 2.20 gives approximately 0.90 and exceeds the illustrative review threshold 0.80.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8192ae"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="18" fill="#0b1020"/>
<text x="40" y="38" font-size="13" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="2">FOUNDATIONS / LOGISTIC</text>
<text x="40" y="84" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">From a score to a probability to a decision</text>
<text x="40" y="117" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">The sigmoid curve maps every real-valued score into the interval (0, 1).</text>
<line x1="40" y1="645" x2="1080" y2="645" stroke="#344563" stroke-width="1"/>
<text x="40" y="674" font-size="14" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Teaching illustration • Use your own lab run for measured results.</text>
<line x1="90" y1="530" x2="730" y2="530" stroke="#344563" stroke-width="1" stroke-dasharray="4 5"/>
<text x="74" y="535" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="end" letter-spacing="0">0.0</text>
<line x1="90" y1="370" x2="730" y2="370" stroke="#344563" stroke-width="1" stroke-dasharray="4 5"/>
<text x="74" y="375" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="end" letter-spacing="0">0.5</text>
<line x1="90" y1="274" x2="730" y2="274" stroke="#344563" stroke-width="1" stroke-dasharray="4 5"/>
<text x="74" y="279" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="end" letter-spacing="0">0.8</text>
<line x1="90" y1="210" x2="730" y2="210" stroke="#344563" stroke-width="1" stroke-dasharray="4 5"/>
<text x="74" y="215" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="end" letter-spacing="0">1.0</text>
<line x1="90" y1="530" x2="750" y2="530" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="90" y1="530" x2="90" y2="185" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
