<text x="666" y="555" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">4</text>
<text x="400" y="585" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">Weighted score</text>
<text x="92" y="169" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Estimated probability</text>
<circle cx="410" cy="370" r="8" fill="#b5a0ff"/>
<line x1="410" y1="380" x2="410" y2="530" stroke="#b5a0ff" stroke-width="1" stroke-dasharray="4 5"/>
<circle cx="550.8" cy="241.92" r="8" fill="#4ade80"/>
<line x1="550.8" y1="251.92" x2="550.8" y2="530" stroke="#4ade80" stroke-width="1" stroke-dasharray="4 5"/>
<text x="425" y="396" font-size="18" fill="#b5a0ff" font-weight="700" text-anchor="start" letter-spacing="0">0 → 0.50</text>
<text x="543.8" y="222" font-size="18" fill="#4ade80" font-weight="700" text-anchor="middle" letter-spacing="0">2.20 → ≈0.90</text>
<rect x="780" y="190" width="300" height="340" rx="12" fill="#131c31"/>
<text x="804" y="226" font-size="20" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="0">Review threshold: 0.80</text>
<text x="804" y="270" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">0.50 &lt; 0.80</text>
<text x="804" y="298" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Do not flag this example.</text>
<text x="804" y="353" font-size="17" fill="#4ade80" font-weight="400" text-anchor="start" letter-spacing="0">0.90 ≥ 0.80</text>
<text x="804" y="381" font-size="17" fill="#4ade80" font-weight="400" text-anchor="start" letter-spacing="0">Flag this example.</text>
<text x="804" y="446" font-size="16" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">A probability estimate</text>
<text x="804" y="474" font-size="16" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">still needs calibration</text>
<text x="804" y="502" font-size="16" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">and held-out evaluation.</text>
<text x="804" y="580" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">p = 1 / (1 + exp(−score))</text>
</g></svg>