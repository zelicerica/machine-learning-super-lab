<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Move a cluster center to the mean of its points</title><desc id="desc">Assigned points 1, 2 and 3 have mean 2. An illustrative old center at 1.5 moves to 2. K-means alternates assignments and center updates; geometric clusters do not automatically establish real-world categories.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8192ae"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="18" fill="#0b1020"/>
<text x="40" y="38" font-size="13" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="2">FOUNDATIONS / CLUSTER</text>
<text x="40" y="84" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">Move a cluster center to the mean of its points</text>
<text x="40" y="117" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Hold the assignments fixed for this one-dimensional center update.</text>
<line x1="40" y1="645" x2="1080" y2="645" stroke="#344563" stroke-width="1"/>
<text x="40" y="674" font-size="14" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Teaching illustration • Use your own lab run for measured results.</text>
<text x="55" y="180" font-size="20" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Three assigned points</text>
<line x1="110" y1="280" x2="1010" y2="280" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="360" cy="280" r="15" fill="#4ade80"/>
<text x="360" y="245" font-size="26" fill="#4ade80" font-weight="700" text-anchor="middle" letter-spacing="0">1</text>
<circle cx="610" cy="280" r="15" fill="#4ade80"/>
<text x="610" y="245" font-size="26" fill="#4ade80" font-weight="700" text-anchor="middle" letter-spacing="0">2</text>
<circle cx="860" cy="280" r="15" fill="#4ade80"/>
<text x="860" y="245" font-size="26" fill="#4ade80" font-weight="700" text-anchor="middle" letter-spacing="0">3</text>
<path d="M473.0 323 L485.0 311 L497.0 323 L485.0 335 Z" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"/>
<text x="485" y="363" font-size="18" fill="#fbbf24" font-weight="400" text-anchor="middle" letter-spacing="0">Old center: 1.5</text>
<line x1="500" y1="323" x2="595" y2="323" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M598 323 L610 311 L622 323 L610 335 Z" fill="#b5a0ff" stroke="#b5a0ff" stroke-width="1"/>
<text x="640" y="329" font-size="20" fill="#b5a0ff" font-weight="700" text-anchor="start" letter-spacing="0">New center: 2</text>
<rect x="55" y="400" width="1010" height="103" rx="12" fill="#131c31"/>
<text x="560" y="464" font-size="38" fill="#e6edf7" font-weight="700" text-anchor="middle" letter-spacing="0">(1 + 2 + 3) / 3 = 2</text>
<text x="80" y="548" font-size="18" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Assign to nearest center</text>
<text x="445" y="548" font-size="18" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Move center to mean</text>
<text x="799" y="548" font-size="18" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Repeat</text>
<line x1="325" y1="541" x2="421" y2="541" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="666" y1="541" x2="771" y2="541" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="55" y="601" font-size="18" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">A compact geometric grouping may still miss the meaningful groups in the real problem.</text>
</g></svg>