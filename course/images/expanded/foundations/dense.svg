<text x="40" y="84" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">Turn pixels into learned hidden features</text>
<text x="40" y="117" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">An 8 × 8 digit becomes 64 inputs, then 32 hidden values, then 10 class scores.</text>
