<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Turn pixels into learned hidden features</title><desc id="desc">A representative network drawing shows only a subset of units, labeled with full sizes 64, 32 and 10. A nonlinear activation follows the hidden weighted sums. Each hidden neuron receives 64 weights and one bias.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8192ae"/></marker></defs>
