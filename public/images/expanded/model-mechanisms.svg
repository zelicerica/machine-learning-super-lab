<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title description">
<title id="title">Four ways to turn inputs into predictions</title><desc id="description">Four panels illustrate weighted-sum prediction, branching tree rules, nearest-neighbor voting, and radial-basis kernel similarity. All numerical values are explicit examples, not trained production-model results.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64775F"/></marker></defs>
<rect width="1200" height="1130" fill="#F5F7F1"/>
<text x="44" y="42.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#64775F" letter-spacing="2">MACHINE LEARNING SUPER LAB</text>
<text x="44" y="94.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#24352B">Four ways to turn inputs into predictions</text>
<text x="44" y="128.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">A numerical example makes each mechanism visible. Real training learns the useful choices.</text>
<rect x="44" y="170" width="534" height="385" rx="18" fill="#FFFFFF" stroke="#DCE5D3"/>
<rect x="66" y="193" width="42" height="32" rx="8" fill="#EAF3DE" stroke="#EAF3DE"/>
<text x="87" y="216.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#64775F">01</text>
<text x="124" y="217.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#24352B">Weighted sum</text>
<text x="68" y="258.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">Linear regression combines feature contributions.</text>
<rect x="69" y="284" width="141" height="61" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="139.5" y="307.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">2 × 1.5</text>
<text x="139.5" y="333.85" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">feature 1</text>
<text x="223" y="321.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#24352B">+</text>
<rect x="251" y="284" width="141" height="61" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="321.5" y="307.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">3 × 0.5</text>
<text x="321.5" y="333.85" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">feature 2</text>
<text x="405" y="321.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#24352B">+</text>
<rect x="432" y="284" width="120" height="61" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="492.0" y="307.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">1</text>
<text x="492.0" y="333.85" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">intercept</text>
<text x="311" y="408.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#24352B">3 + 1.5 + 1 = 5.5</text>
<text x="69" y="468.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">Learning adjusts the weights to reduce error.</text>
<text x="69" y="494.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">The interpretation depends on feature units.</text>
<rect x="622" y="170" width="534" height="385" rx="18" fill="#FFFFFF" stroke="#DCE5D3"/>
<rect x="644" y="193" width="42" height="32" rx="8" fill="#EAF3DE" stroke="#EAF3DE"/>
<text x="665" y="216.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#64775F">02</text>
<text x="702" y="217.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#24352B">Branching questions</text>
<text x="646" y="258.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">Decision trees learn feature thresholds.</text>
<rect x="771" y="275" width="235" height="49" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="888.5" y="305.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">Latency &gt; 200?</text>
<path d="M800 324V359H712V387" fill="none" stroke="#64775F" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M972 324V359H1042V387" fill="none" stroke="#64775F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="728" y="350.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#24352B">No</text>
<text x="1009" y="350.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#24352B">Yes</text>
<rect x="649" y="392" width="126" height="47" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="712.0" y="421.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">Routine</text>
<rect x="916" y="392" width="212" height="47" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="1022.0" y="421.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#24352B">Errors &gt; 3?</text>
<text x="648" y="486.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">For latency = 220 and errors = 4,</text>
<text x="648" y="512.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">both questions answer “yes” → escalate.</text>
<rect x="44" y="582" width="534" height="440" rx="18" fill="#FFFFFF" stroke="#DCE5D3"/>
<rect x="66" y="605" width="42" height="32" rx="8" fill="#EAF3DE" stroke="#EAF3DE"/>
<text x="87" y="628.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#64775F">03</text>
<text x="124" y="629.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#24352B">Nearest-neighbor vote</text>
<text x="68" y="670.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">Nearby examples vote on a label.</text>
<circle cx="105" cy="721" r="23" fill="#C7ED91" stroke="#24352B"/>
<text x="105" y="728.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24352B">A</text>
<circle cx="170" cy="703" r="23" fill="#C7ED91" stroke="#24352B"/>
<text x="170" y="710.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24352B">A</text>
<circle cx="226" cy="742" r="23" fill="#C7ED91" stroke="#24352B"/>
<text x="226" y="749.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24352B">A</text>
<circle cx="303" cy="709" r="23" fill="#C7ED91" stroke="#24352B"/>
<text x="303" y="716.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24352B">A</text>
<circle cx="370" cy="744" r="23" fill="#EAD8C6" stroke="#24352B"/>
<text x="370" y="751.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24352B">B</text>
<circle cx="435" cy="705" r="23" fill="#EAD8C6" stroke="#24352B"/>
<text x="435" y="712.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24352B">B</text>
<circle cx="491" cy="751" r="23" fill="#EAD8C6" stroke="#24352B"/>
<text x="491" y="758.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24352B">B</text>
<text x="69" y="821.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#24352B">7 neighbors: 4 label A, 3 label B</text>
<text x="69" y="866.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">Majority prediction: A</text>
<text x="69" y="892.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">Vote fraction: 4 ÷ 7 ≈ 0.57</text>
<text x="69" y="918.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">A vote fraction is not automatically</text>
<text x="69" y="944.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">a calibrated probability.</text>
<rect x="622" y="582" width="534" height="440" rx="18" fill="#FFFFFF" stroke="#DCE5D3"/>
<rect x="644" y="605" width="42" height="32" rx="8" fill="#EAF3DE" stroke="#EAF3DE"/>
<text x="665" y="628.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#64775F">04</text>
<text x="702" y="629.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#24352B">Kernel similarity</text>
<text x="646" y="670.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">A kernel measures similarity implicitly.</text>
<text x="648" y="713.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#24352B">Radial basis similarity = exp(−γ × distance²)</text>
<text x="648" y="739.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#24352B">Take γ = 0.5 and reference point (1, 0).</text>
<rect x="649" y="779" width="480" height="58" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="889.0" y="813.95" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#24352B">Point (1, 1): distance² = 1 → similarity 0.607</text>
<rect x="649" y="850" width="480" height="58" rx="10" fill="#EAF3DE" stroke="#DCE5D3"/>
<text x="889.0" y="884.95" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#24352B">Point (3, 0): distance² = 4 → similarity 0.135</text>
<text x="649" y="947.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">A classifier combines similarities to reference</text>
<text x="649" y="973.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#64775F">points; the resulting boundary can be curved.</text>
<line x1="44" y1="1069" x2="1156" y2="1069" stroke="#DCE5D3" stroke-width="2"/>
<text x="44" y="1100.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64775F">The formulas illustrate mechanisms. A realistic model needs representative data and independent evaluation.</text>
</svg>