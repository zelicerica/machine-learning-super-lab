<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Build a prediction from feature contributions</title><desc id="desc">Intercept 5 plus 2 times 10, 3 times 2, and 8 times 1 gives 39. An observed duration of 43 has residual 4 and squared error 16.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8192ae"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="18" fill="#0b1020"/>
<text x="40" y="38" font-size="13" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="2">FOUNDATIONS / LINEAR</text>
<text x="40" y="84" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">Build a prediction from feature contributions</text>
<text x="40" y="117" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">The example predicts a duration from three measurements and an intercept.</text>
<line x1="40" y1="645" x2="1080" y2="645" stroke="#344563" stroke-width="1"/>
<text x="40" y="674" font-size="14" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Teaching illustration • Use your own lab run for measured results.</text>
<text x="48" y="171" font-size="20" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Add the learned contributions</text>
<text x="48" y="233" font-size="18" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Intercept</text>
<text x="275" y="233" font-size="19" fill="#4ade80" font-weight="700" text-anchor="end" letter-spacing="0">5</text>
<rect x="315" y="211" width="480" height="35" rx="4" fill="#0b1020" stroke="#344563"/>
<rect x="315" y="211" width="50" height="35" rx="4" fill="#4ade80"/>
<text x="820" y="235" font-size="21" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">5</text>
<text x="48" y="309" font-size="18" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Record count</text>
<text x="275" y="309" font-size="19" fill="#b5a0ff" font-weight="700" text-anchor="end" letter-spacing="0">2 × 10</text>
<rect x="315" y="287" width="480" height="35" rx="4" fill="#0b1020" stroke="#344563"/>
<rect x="365" y="287" width="200" height="35" rx="4" fill="#b5a0ff"/>
<text x="820" y="311" font-size="21" fill="#b5a0ff" font-weight="700" text-anchor="start" letter-spacing="0">25</text>
<text x="48" y="385" font-size="18" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Transformations</text>
<text x="275" y="385" font-size="19" fill="#fbbf24" font-weight="700" text-anchor="end" letter-spacing="0">3 × 2</text>
<rect x="315" y="363" width="480" height="35" rx="4" fill="#0b1020" stroke="#344563"/>
<rect x="565" y="363" width="60" height="35" rx="4" fill="#fbbf24"/>
<text x="820" y="387" font-size="21" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="0">31</text>
<text x="48" y="461" font-size="18" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Compression</text>
<text x="275" y="461" font-size="19" fill="#fb8fa1" font-weight="700" text-anchor="end" letter-spacing="0">8 × 1</text>
<rect x="315" y="439" width="480" height="35" rx="4" fill="#0b1020" stroke="#344563"/>
<rect x="625" y="439" width="80" height="35" rx="4" fill="#fb8fa1"/>
<text x="820" y="463" font-size="21" fill="#fb8fa1" font-weight="700" text-anchor="start" letter-spacing="0">39</text>
<text x="881" y="225" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Running</text>
<text x="881" y="253" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">total</text>
<line x1="315" y1="510" x2="795" y2="510" stroke="#344563" stroke-width="2"/>
<line x1="315" y1="506" x2="315" y2="516" stroke="#344563" stroke-width="2"/>
<text x="315" y="540" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">0</text>
<line x1="415" y1="506" x2="415" y2="516" stroke="#344563" stroke-width="2"/>
<text x="415" y="540" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">10</text>
<line x1="515" y1="506" x2="515" y2="516" stroke="#344563" stroke-width="2"/>
<text x="515" y="540" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">20</text>
<line x1="615" y1="506" x2="615" y2="516" stroke="#344563" stroke-width="2"/>
<text x="615" y="540" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">30</text>
<line x1="715" y1="506" x2="715" y2="516" stroke="#344563" stroke-width="2"/>
<text x="715" y="540" font-size="15" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">40</text>
<rect x="48" y="554" width="1024" height="82" rx="12" fill="#131c31"/>
<rect x="48" y="554" width="4" height="82" rx="2" fill="#4ade80"/>
<text x="68" y="583" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Prediction: 5 + 20 + 6 + 8 = 39     Observed: 43</text>
<text x="68" y="608" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Residual: 43 − 39 = 4     Squared error: 4² = 16</text>
</g></svg>