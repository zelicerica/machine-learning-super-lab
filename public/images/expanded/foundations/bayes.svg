<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Update a prior using evidence, then normalize</title><desc id="desc">Illustrative prior fault probability is 0.1 and normal probability is 0.9. Event likelihoods 0.8 under fault and 0.1 under normal yield joint scores 0.08 and 0.09. Normalizing gives fault probability 0.08/0.17, approximately 47.1 percent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8192ae"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="18" fill="#0b1020"/>
<text x="40" y="38" font-size="13" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="2">FOUNDATIONS / BAYES</text>
<text x="40" y="84" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">Update a prior using evidence, then normalize</text>
<text x="40" y="117" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">A binary “unusual reading” event makes the probability arithmetic concrete.</text>
<line x1="40" y1="645" x2="1080" y2="645" stroke="#344563" stroke-width="1"/>
<text x="40" y="674" font-size="14" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Teaching illustration • Use your own lab run for measured results.</text>
<text x="50" y="185" font-size="20" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Class prior</text>
<text x="390" y="185" font-size="20" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Event likelihood</text>
<text x="750" y="185" font-size="20" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Unnormalized score</text>
<rect x="40" y="224" width="260" height="105" rx="12" fill="#131c31"/>
<text x="60" y="259" font-size="20" fill="#fb8fa1" font-weight="700" text-anchor="start" letter-spacing="0">Fault</text>
<text x="260" y="302" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="end" letter-spacing="0">0.10</text>
<text x="333" y="289" font-size="30" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">×</text>
<rect x="370" y="224" width="300" height="105" rx="12" fill="#131c31"/>
<text x="520" y="289" font-size="32" fill="#e6edf7" font-weight="700" text-anchor="middle" letter-spacing="0">0.80</text>
<line x1="683" y1="277" x2="732" y2="277" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="224" width="330" height="105" rx="12" fill="#131c31"/>
<text x="916" y="289" font-size="32" fill="#fb8fa1" font-weight="700" text-anchor="middle" letter-spacing="0">0.08</text>
<rect x="40" y="362" width="260" height="105" rx="12" fill="#131c31"/>
<text x="60" y="397" font-size="20" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">Normal</text>
<text x="260" y="440" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="end" letter-spacing="0">0.90</text>
<text x="333" y="427" font-size="30" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">×</text>
<rect x="370" y="362" width="300" height="105" rx="12" fill="#131c31"/>
<text x="520" y="427" font-size="32" fill="#e6edf7" font-weight="700" text-anchor="middle" letter-spacing="0">0.10</text>
<line x1="683" y1="415" x2="732" y2="415" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="362" width="330" height="105" rx="12" fill="#131c31"/>
<text x="916" y="427" font-size="32" fill="#4ade80" font-weight="700" text-anchor="middle" letter-spacing="0">0.09</text>
<text x="40" y="514" font-size="23" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">Normalize over both classes: 0.08 + 0.09 = 0.17</text>
<rect x="40" y="546" width="1040" height="35" rx="5" fill="#344563"/>
<rect x="40" y="546" width="489.412" height="35" rx="5" fill="#fb8fa1"/>
<text x="40" y="613" font-size="23" fill="#fb8fa1" font-weight="700" text-anchor="start" letter-spacing="0">Posterior fault: 0.08 / 0.17 ≈ 47.1%</text>
<text x="1075" y="613" font-size="21" fill="#4ade80" font-weight="700" text-anchor="end" letter-spacing="0">Normal: ≈52.9%</text>
</g></svg>