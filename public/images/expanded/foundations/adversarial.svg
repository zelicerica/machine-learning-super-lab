<title id="title">A plausible sample can hide a missing mode</title><desc id="desc">Illustrative distributions show the target with half its mass near minus 2 and half near plus 2. A collapsed generator has all mass near plus 2. Curves are schematic densities, not measured outputs from the runnable lab.</desc>
