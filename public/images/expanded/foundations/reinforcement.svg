<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Move an action value toward its target</title><desc id="desc">Q-learning current action value 2 is updated toward target 6 with learning rate 0.2. Twenty percent of the gap of four is 0.8, so the new value is 2.8. At a terminal goal the target contains the immediate reward without a future value.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8192ae"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="18" fill="#0b1020"/>
<text x="40" y="38" font-size="13" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="2">FOUNDATIONS / REINFORCEMENT</text>
<text x="40" y="84" font-size="30" fill="#e6edf7" font-weight="700" text-anchor="start" letter-spacing="0">Move an action value toward its target</text>
<text x="40" y="117" font-size="17" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">The learning rate determines how much of the current error enters one update.</text>
<line x1="40" y1="645" x2="1080" y2="645" stroke="#344563" stroke-width="1"/>
<text x="40" y="674" font-size="14" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Teaching illustration • Use your own lab run for measured results.</text>
<rect x="40" y="165" width="1040" height="126" rx="12" fill="#131c31"/>
<text x="80" y="203" font-size="18" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Current value</text>
<text x="80" y="259" font-size="39" fill="#b5a0ff" font-weight="700" text-anchor="start" letter-spacing="0">2</text>
<text x="432" y="203" font-size="18" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Learning rate</text>
<text x="432" y="259" font-size="39" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="0">0.2</text>
<text x="784" y="203" font-size="18" fill="#b4c1d5" font-weight="400" text-anchor="start" letter-spacing="0">Target</text>
<text x="784" y="259" font-size="39" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="0">6</text>
<line x1="85" y1="391" x2="1032" y2="391" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="100" y1="385" x2="100" y2="402" stroke="#344563" stroke-width="2"/>
<text x="100" y="436" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">0</text>
<line x1="390" y1="385" x2="390" y2="402" stroke="#344563" stroke-width="2"/>
<text x="390" y="436" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">2</text>
<line x1="506" y1="385" x2="506" y2="402" stroke="#344563" stroke-width="2"/>
<text x="506" y="436" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">2.8</text>
<line x1="680" y1="385" x2="680" y2="402" stroke="#344563" stroke-width="2"/>
<text x="680" y="436" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">4</text>
<line x1="970" y1="385" x2="970" y2="402" stroke="#344563" stroke-width="2"/>
<text x="970" y="436" font-size="19" fill="#b4c1d5" font-weight="400" text-anchor="middle" letter-spacing="0">6</text>
<circle cx="390" cy="391" r="9" fill="#b5a0ff"/>
<circle cx="970" cy="391" r="9" fill="#4ade80"/>
<path d="M494.0 391 L506.0 379 L518.0 391 L506.0 403 Z" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"/>
<path d="M390 369 V337 H506.0 V369" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="346" font-size="18" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="0">Move 20% of the gap: 0.2 × 4 = 0.8</text>
<text x="560" y="510" font-size="35" fill="#e6edf7" font-weight="700" text-anchor="middle" letter-spacing="0">2 + 0.2 × (6 − 2) = 2.8</text>
<rect x="40" y="551" width="1040" height="82" rx="12" fill="#131c31"/>
<rect x="40" y="551" width="4" height="82" rx="2" fill="#4ade80"/>
<text x="60" y="580" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">Nonterminal target: reward + discounted next-state value.</text>
<text x="60" y="605" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">At the terminal goal, use the immediate reward only; there is no future-state value.</text>
</g></svg>