<text x="60" y="584" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">A radial basis kernel supplies nonlinear similarities without this explicit radius calculation.</text>
<text x="60" y="609" font-size="17" fill="#e6edf7" font-weight="400" text-anchor="start" letter-spacing="0">The sketch explains the geometry; it does not show the kernel’s exact feature map.</text>
