<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Curved geometry can need a richer representation</title><desc id="desc">Two concentric classes cannot be separated by a straight line in the original plane. Squared radius maps the inner ring near one and outer ring near four. This explicit radial illustration is not the exact radial-basis-kernel feature mapping.</desc>
