<title id="title">Predict a mean and an uncertainty interval</title><desc id="desc">The plotted Gaussian density has mean 10 and standard deviation 2. Its interval from 10 minus 1.96 times 2 to 10 plus 1.96 times 2 is 6.08 to 13.92, conditional on the model assumptions.</desc>
