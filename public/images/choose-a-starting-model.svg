   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b42" x="57.6" y="46.8" transform="rotate(-0 57.6 46.8)">Choose the smallest useful starting system</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506479" x="57.6" y="86.112" transform="rotate(-0 57.6 86.112)">Follow the task first, then check memory, evaluate and adapt.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="576" y="170.830938" transform="rotate(-0 576 170.830938)">What output does your task need?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="207.36" y="315.221094" transform="rotate(-0 207.36 315.221094)">A label or search result</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(114.911875 425.78682)">Try rules, a small classifier</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(156.93375 443.05943)">or an encoder.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="576" y="315.221094" transform="rotate(-0 576 315.221094)">Generated text</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(511.945625 425.78682)">Start with a dense</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(469.954375 443.05943)">instruction-tuned Transformer.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="944.64" y="315.221094" transform="rotate(-0 944.64 315.221094)">An answer about an image</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(865.211875 425.78682)">Start with a pretrained</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(862.877813 443.05943)">vision-language model.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b42" x="576" y="594.095" transform="rotate(-0 576 594.095)">Does it fit your memory and meet your tests?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #12856c" x="328.32" y="667.368" transform="rotate(-0 328.32 667.368)">Yes</text>
   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b77920" x="806.4" y="667.368" transform="rotate(-0 806.4 667.368)">No</text>
   </g>
   <g id="text_13">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(172.713516 771.765879)">Keep the simple system.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(151.783828 790.272246)">Measure it on fresh examples.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(780.257109 771.765879)">Diagnose the failure first.</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #152b42" transform="translate(731.715703 790.272246)">Change one thing and evaluate again.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b42" x="57.6" y="875">Missing facts → inspect retrieval  •  Memory limit → smaller model or compression</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b42" x="57.6" y="899">Behavior gap → inspect prompts, examples, and output contract</text>
   </g>
  </g>
 </g>
